name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned runtime
        # `npm_config_user_agent` only exists inside an npm-run script, so the
        # npm version is read from `npm --version` instead.
        run: |
          node --version
          npm --version
          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          case "$NODE_VERSION" in
            v20.19.*) ;;
            *) echo "Unexpected Node.js version: $NODE_VERSION" >&2; exit 1 ;;
          esac
          case "$NPM_VERSION" in
            10.8.*) ;;
            *) echo "Unexpected npm version: $NPM_VERSION" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check documentation links
        run: npm run docs:check

      - name: Typecheck
        run: npm run check -- --incremental false

      - name: Test with coverage
        run: npm run test:coverage -- --run

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
