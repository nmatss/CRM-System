services:
  app:
    image: zippcrm:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lets /api/health and the metrics identify the exact artifact.
        BUILD_COMMIT: ${APP_VERSION:-unknown}
    container_name: zippcrm-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-6000}:6000"
    environment:
      NODE_ENV: production
      PORT: 6000
      DATABASE_PATH: /app/data/zippcrm.db
      SESSION_DATABASE_PATH: /app/data/sessions.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET with at least 32 characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL for the initial super admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD with at least 12 characters}
      ALLOW_EMPTY_DATABASE_BOOTSTRAP: ${ALLOW_EMPTY_DATABASE_BOOTSTRAP:-false}
    volumes:
      - zippcrm_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:6000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  zippcrm_data:
    name: zippcrm-sqlite-data
