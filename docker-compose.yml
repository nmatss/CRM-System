version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zippcrm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zippcrm
      POSTGRES_PASSWORD: zippcrm123
      POSTGRES_DB: zippcrm
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zippcrm -d zippcrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Interface web para gerenciar o banco (opcional)
  adminer:
    image: adminer:latest
    container_name: zippcrm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
    name: zippcrm-postgres-data
