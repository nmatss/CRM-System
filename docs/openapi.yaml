                properties:
                  version:
                    type: string
                    example: "2026-08-29"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/search:
    get:
      summary: Tenant-scoped global search
      description: |
        Searches customers, products and orders of the active tenant. The term
        must be at least 2 characters; LIKE wildcards in the term are escaped and
        matched literally. The response caps how many rows of each type it
        carries and reports whether more matched.
      operationId: globalSearch
      tags:
        - Reports
      security:
        - sessionAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search term, 2 to 100 characters
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Maximum rows per type, capped at 20
          schema:
            type: integer
      responses:
        "200":
          description: Matches grouped with per-type totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [customer, product, order]
                        id:
                          type: integer
                        title:
                          type: string
                        subtitle:
                          type: string
                          nullable: true
                        href:
                          type: string
                  totals:
                    type: object
                    additionalProperties:
                      type: integer
                  truncated:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark one notification as read
      description: Scoped to the active tenant and to the signed-in user, so an id from another account changes nothing.
      operationId: markNotificationRead
      tags:
        - Notifications
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification identifier
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/notifications/read-all:
    post:
      summary: Mark every notification of the signed-in user as read
      description: Clears the badge in one action. Only the caller's own rows in the active tenant are affected.
      operationId: markAllNotificationsRead
      tags:
        - Notifications
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
